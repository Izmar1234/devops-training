{{- if and .Values.ingress.enabled .Values.adminer.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-adminer-strip
  namespace: {{ .Release.Namespace }}
spec:
  stripPrefix:
    prefixes:
      - /adminer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-adminer-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-adminer-strip@kubernetescrd" .Release.Namespace .Release.Name | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - http:
        paths:
          - path: /adminer
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-adminer
                port:
                  number: 8080
{{- end }}
