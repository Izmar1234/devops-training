apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanban-ui
  namespace: kanban
  labels:
    app.kubernetes.io/part-of: kanban
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kanban-ui
  template:
    metadata:
      labels:
        app: kanban-ui
        app.kubernetes.io/part-of: kanban
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kanban-ui
          image: wkrzywiec/kanban-ui:k8s
          imagePullPolicy: IfNotPresent
          command:
            - nginx
          args:
            - "-g"
            - "daemon off;"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: nginx-config
          configMap:
            name: kanban-ui-config
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi
