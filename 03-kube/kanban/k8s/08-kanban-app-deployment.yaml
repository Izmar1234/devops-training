apiVersion: apps/v1
kind: Deployment

metadata:
  name: kanban-app
  namespace: kanban
  labels:
    app.kubernetes.io/part-of: kanban

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kanban-app

  template:
    metadata:
      labels:
        app: kanban-app
        app.kubernetes.io/part-of: kanban

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: kanban-app
          image: wkrzywiec/kanban-app:k8s
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: postgres-secret

          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx384m"

          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /api/actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /api/actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          volumeMounts:
            - name: temporary-files
              mountPath: /tmp

      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi
