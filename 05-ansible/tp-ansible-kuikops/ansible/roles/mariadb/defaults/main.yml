---
# defaults file for roles/mariadb
mariadb_packages:
  - mariadb-server
  - python3-pymysql

mariadb_service_name: mariadb
mariadb_port: 3306

mariadb_bind_address: "{{ ansible_facts.default_ipv4.address }}"

glpi_db_name: glpi
glpi_db_user: glpi
glpi_db_user_host: "10.0.20.164"

glpi_db_encoding: utf8mb4
glpi_db_collation: utf8mb4_unicode_ci

glpi_db_password: "{{ vault_glpi_db_password }}"